name: Build Mod

on:
  push:
    branches:
      - "1.20.1"
      - "1.20.1-dev"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: List build output
        run: |
          echo "Build output:"
          ls -lah build/libs/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: more-scp-alarm-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
